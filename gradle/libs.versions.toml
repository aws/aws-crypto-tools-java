# Versions for every library in this repository and for build-logic.
# A library's settings.gradle.kts and build-logic's both read this file as the `libs` catalog.

[versions]
jacoco = "0.8.16"
junit = "5.11.3"
junit-platform = "1.11.3"
error-prone = "2.52.0"
google-java-format = "1.28.0"
pitest = "1.30.2"
pitest-junit5 = "1.2.3"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
error-prone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "error-prone" }

# The Gradle plugins that build-logic applies.
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version = "8.11.0" }
errorprone-gradle = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version = "5.2.0" }
pitest-gradle = { module = "info.solidsoft.gradle.pitest:gradle-pitest-plugin", version = "1.19.0" }
japicmp-gradle = { module = "me.champeau.gradle:japicmp-gradle-plugin", version = "0.4.6" }
