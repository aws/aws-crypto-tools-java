// The Gradle init script every CI gate passes with -I, so each module gets the same checks
// without listing them in its own build file. It applies to every project with the java plugin
// in every build the root settings include. Each check is off unless its property is set:
//
//   -PciJavaVersion=N   compile and test with Java N instead of the module's toolchain
//   -PciLint            Spotless (google-java-format) and Error Prone on the module's own code
//   -PciPerTest         add PerTestCoverageListener to the tests (see per-test/src)
//   -PciMutation        apply PIT; -PpitestClasses=a.B,a.B$* limits it to those classes
//
// JaCoCo is always on, with the XML report written after the tests.

initscript {
  repositories { gradlePluginPortal() }
  dependencies {
    classpath "com.diffplug.spotless:spotless-plugin-gradle:8.11.0"
    classpath "net.ltgt.gradle:gradle-errorprone-plugin:5.2.0"
    classpath "info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.19.0"
  }
}

def ciDir = new File(startParameter.initScripts.find { it.name == "ci.init.gradle" }.absolutePath).parentFile

allprojects {
  afterEvaluate { project ->
    if (!project.plugins.hasPlugin("java")) {
      return
    }
    project.repositories { mavenCentral() }
    def toolchains = project.extensions.getByType(JavaToolchainService)

    if (project.hasProperty("ciJavaVersion")) {
      def version = JavaLanguageVersion.of(project.property("ciJavaVersion") as int)
      project.tasks.withType(JavaCompile).configureEach {
        javaCompiler = toolchains.compilerFor { languageVersion = version }
        // A newer javac warns that the module's older source level is obsolete, and -Werror fails on it.
        options.compilerArgs << "-Xlint:-options"
      }
      project.tasks.withType(Test).configureEach { javaLauncher = toolchains.launcherFor { languageVersion = version } }
    }

    if (!project.plugins.hasPlugin("jacoco")) {
      project.apply plugin: "jacoco"
    }
    project.jacoco { toolVersion = "0.8.16" }
    project.tasks.named("jacocoTestReport") { reports { xml.required = true } }
    project.tasks.named("test") { finalizedBy "jacocoTestReport" }

    if (project.hasProperty("ciLint")) {
      project.apply plugin: com.diffplug.gradle.spotless.SpotlessPlugin
      project.spotless {
        java {
          target "src/*/java/**/*.java"
          googleJavaFormat("1.28.0")
        }
      }
      project.apply plugin: net.ltgt.gradle.errorprone.ErrorPronePlugin
      project.dependencies { errorprone "com.google.errorprone:error_prone_core:2.52.0" }
      // Error Prone runs inside javac, and this version needs Java 21 to run.
      def lintCompiler = toolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
      project.tasks.withType(JavaCompile).configureEach {
        javaCompiler = lintCompiler
        options.compilerArgs << "-Xlint:-options"
        options.errorprone.enabled = true
        options.errorprone.disableWarningsInGeneratedCode = true
      }
    }

    if (project.hasProperty("ciPerTest")) {
      project.sourceSets.test.java.srcDir(new File(ciDir, "per-test/src"))
      project.sourceSets.test.resources.srcDir(new File(ciDir, "per-test/resources"))
      project.dependencies { testCompileOnly "org.junit.platform:junit-platform-launcher:1.11.3" }
    }

    if (project.hasProperty("ciMutation")) {
      project.apply plugin: info.solidsoft.gradle.pitest.PitestPlugin
      project.pitest {
        pitestVersion = "1.30.2"
        junit5PluginVersion = "1.2.3"
        targetClasses = project.hasProperty("pitestClasses") ? project.property("pitestClasses").split(",") as List : ["*"]
        // Without this, PIT runs only the tests whose names match targetClasses.
        targetTests = ["*"]
        threads = Runtime.runtime.availableProcessors()
        // PIT writes the full mutation matrix only in XML.
        outputFormats = ["XML"]
        timestampedReports = false
        // PIT finds nothing to mutate in a class with only constants or an interface.
        failWhenNoMutations = false
        // Keep each mutant's full list of killing tests for the dashboard.
        fullMutationMatrix = true
      }
      // PIT 1.30 needs Java 11 or later.
      project.tasks.named("pitest") { javaLauncher = toolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) } }
    }
  }
}
