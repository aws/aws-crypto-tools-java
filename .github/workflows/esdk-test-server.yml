# ============================================================================
# ESDK TestServer CI (aws-crypto-tools-java Language_Repository)
# ----------------------------------------------------------------------------
# LOCATION MATTERS: this file lives FLAT, directly under `.github/workflows/`.
# GitHub Actions only discovers workflow files that sit directly in
# `.github/workflows/` — a nested file such as `.github/workflows/esdk/...`
# would NEVER be triggered. Because this repo may host tooling for more than one
# product over time, we namespace per product with a filename PREFIX instead of
# a subdirectory: `esdk-` marks this as the ESDK TestServer workflow. (The spec
# design sketch showed `.github/workflows/esdk/test-server.yml`; that path is
# not runnable on GitHub Actions, so the flat product-prefixed name is used.)
#
# WHAT THIS DOES (Requirements 8.2, 8.3, 8.4, 8.5, 10.1, 11.1, 11.2):
#   1. Clone the Commons_Repository FRESH at the head of COMMONS_BRANCH (no
#      stored pin) and set it up.  <- if this fails, the job halts here and NO
#      Tests run; the failing step names the setup failure (Requirement 8.5).
#   2. Build THIS PR's working tree as the LIVE ESDK Java artifact into the
#      local Maven repo (Requirement 11.2).
#   3. Run the commons orchestrator with `live:java=<this working tree>`; every
#      Other language resolves to head-of-main (Requirements 10.1, 11.1).
#
# The heavy lifting lives in `esdk/test-server/Makefile`; this workflow only
# provides the toolchain and invokes the make targets in order, so the CI and
# local flows stay identical. Its shape mirrors the commons
# `.github/workflows/esdk-test-server.yml` and the multi-language S3EC reference
# workflow (clone/setup + build + orchestrate).
#
# JDK SPLIT (documented in the Makefile too): the commons harness (smithy-java)
# needs JDK 21+; the live ESDK Java build targets Java 8 and builds on JDK 17.
# We set up both and hand their homes to make as HARNESS_JAVA_HOME / ESDK_JAVA_HOME.
#
# COMMONS COORDINATES: the Commons_Repository branch (and name/URL) come from the
# Commons_Source_Config `esdk/test-server/commons-source.json` — the single
# source of truth for those coordinates (Requirement 8.2). A resolve step below
# reads the branch from that JSON with python3 and exports it as COMMONS_BRANCH,
# EXCEPT when a workflow_dispatch/workflow_call `commons_branch` input is
# provided, which overrides the JSON. The design default branch is `main`; the
# JSON currently pins the `kessplas/esdk-test-server` feature branch until the
# TestServer merges to commons main (then flip it back to `main` in the JSON).
#
# PRIVATE COMMONS CLONE AUTH (COMMONS_REPO_PAT secret): the "Clone + set up
# commons at head" step runs `make clone-commons-at-head`, which internally does
# `git clone git@github.com:aws/aws-crypto-tools-commons.git ...` (the SSH URL
# comes from commons-source.json). aws-crypto-tools-commons is a PRIVATE repo,
# and in GitHub Actions the default GITHUB_TOKEN / checkout token only grants
# access to THIS repo — so that cross-repo clone fails without extra auth. To
# fix this, add a repository (or org) secret named COMMONS_REPO_PAT and the
# "Configure git auth for the private commons repo" step below rewrites the SSH
# URL to authenticated HTTPS for the duration of the job.
#   Required token scope: READ access to the contents of aws-crypto-tools-commons
#   — a fine-grained PAT with `Contents: Read` on that repo, OR a classic PAT
#   with the `repo` scope.
#
# AWS/KMS (FUTURE): the commons Java-only blob round trip uses an OFFLINE
# Raw-AES keyring today — no AWS account, no KMS, no network beyond package
# downloads. When KMS keyrings are exercised, add OIDC auth mirroring S3EC:
#   permissions: { id-token: write }   # in addition to contents: read
#   - uses: aws-actions/configure-aws-credentials@v4
#       with: { role-to-assume: <OIDC role ARN>, aws-region: us-west-2 }
# ============================================================================

name: ESDK TestServer

on:
  pull_request:
    paths:
      - "esdk/**"
      - ".github/workflows/esdk-test-server.yml"
  workflow_dispatch:
    inputs:
      commons_branch:
        description: >-
          Commons_Repository branch to clone at head. Leave EMPTY to use the
          branch from commons-source.json (the single source of truth); set a
          value here only to override it for this run.
        required: false
        default: ""
        type: string
  # Allow an aggregate/parent CI workflow to reuse this one.
  workflow_call:
    inputs:
      commons_branch:
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  # The commons branch is NOT hardcoded here: it is resolved from
  # commons-source.json by the "Resolve commons branch" step below (which honors
  # a non-empty commons_branch input as an override) and exported to
  # $GITHUB_ENV. Only the pass-through override input is captured here.
  COMMONS_BRANCH_INPUT: ${{ inputs.commons_branch }}
  ESDK_LIVE_VERSION: "3.0.2-LIVE-SNAPSHOT"

jobs:
  esdk-test-server:
    # Pure-JVM build; ubuntu is sufficient.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (PR working tree = live ESDK Java source)
        # No submodules: the ESDK Java build consumes the AWS Cryptographic
        # Material Providers library as a PUBLISHED artifact (esdk/pom.xml), so
        # the heavy Dafny/Smithy-Dafny MaterialProviders submodule is not needed
        # to build the live Java source.
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Resolve commons branch from commons-source.json (single source of truth)
        # Reads the branch from the Commons_Source_Config (Requirement 8.2) with
        # python3 (always present on ubuntu; no jq needed) and exports it as
        # COMMONS_BRANCH for the later make steps. A non-empty workflow_dispatch/
        # workflow_call `commons_branch` input OVERRIDES the JSON value; when the
        # input is empty (the normal PR case) the JSON value is used. Fails the
        # job with a clear error if the config is missing or unparseable — it is
        # the single source of truth, so its absence is a hard error.
        run: |
          set -euo pipefail
          CONFIG="esdk/test-server/commons-source.json"
          if [ -n "${COMMONS_BRANCH_INPUT}" ]; then
            branch="${COMMONS_BRANCH_INPUT}"
            echo "Using commons branch from workflow input (overrides JSON): ${branch}"
          else
            if [ ! -f "${CONFIG}" ]; then
              echo "ERROR: Commons_Source_Config not found at ${CONFIG}; it is the single source of truth for the commons branch." >&2
              exit 1
            fi
            branch="$(python3 -c 'import json,sys; print(json.load(open("'"${CONFIG}"'"))["commonsRepository"]["branch"])')" || {
              echo "ERROR: failed to parse ${CONFIG}; expected valid JSON with .commonsRepository.branch." >&2
              exit 1
            }
            echo "Using commons branch from ${CONFIG}: ${branch}"
          fi
          echo "COMMONS_BRANCH=${branch}" >> "$GITHUB_ENV"

      - name: Set up JDK 17 (Temurin) for the live ESDK build
        # First setup-java: exposes JAVA_HOME_17_X64 for the ESDK build (Java 8
        # target compiles cleanly on 17).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up JDK 21 (Temurin) for the commons harness
        # Second setup-java runs last, so it also sets the default JAVA_HOME to
        # 21; smithy-java requires JDK 21+. Exposes JAVA_HOME_21_X64.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle + Maven caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: >-
            ${{ runner.os }}-esdk-ts-${{ hashFiles(
              'esdk/pom.xml',
              'esdk/test-server/Makefile'
            ) }}
          restore-keys: |
            ${{ runner.os }}-esdk-ts-

      - name: Install stub for the unpublished test-vectors artifact
        # esdk/pom.xml declares a TEST-scope, optional dependency
        # `software.amazon.cryptography:TestAwsCryptographicMaterialProviders`
        # that is NOT published to Maven Central (it is produced from the
        # MaterialProviders submodule's Dafny build). Maven resolves test-scope
        # deps for the whole lifecycle even when tests are skipped, so we install
        # a tiny stub JAR to satisfy resolution. This only affects the ESDK's own
        # (skipped) test suite; the LIVE main jar we install is the real build.
        run: |
          set -euo pipefail
          MP_VERSION="1.7.0"
          tmp="$(mktemp -d)"
          echo "placeholder for unpublished test-vectors artifact" > "$tmp/README.txt"
          "$JAVA_HOME_17_X64/bin/jar" cf "$tmp/stub.jar" -C "$tmp" README.txt
          mvn -q -e org.apache.maven.plugins:maven-install-plugin:3.1.1:install-file \
            -Dfile="$tmp/stub.jar" \
            -DgroupId=software.amazon.cryptography \
            -DartifactId=TestAwsCryptographicMaterialProviders \
            -Dversion="$MP_VERSION" \
            -Dpackaging=jar

      - name: Configure git auth for the private commons repo
        # WHY: the next step clones the PRIVATE aws-crypto-tools-commons repo
        # (make clone-commons-at-head -> `git clone git@github.com:aws/...`).
        # GitHub Actions' default token only reaches THIS repo, so that
        # cross-repo private clone needs its own credential. We supply a PAT
        # (COMMONS_REPO_PAT) and rewrite the SSH URL from commons-source.json to
        # authenticated HTTPS via git's insteadOf, mirroring the S3EC reference
        # approach. Nothing in commons-source.json or the Makefile changes.
        #
        # SECURITY NOTES:
        #   - The PAT is passed only via the step `env:` below (never inlined in
        #     the script), and GitHub automatically masks the secret value in
        #     logs. We do NOT use `set -x`, so the configured URL is not echoed.
        #   - The token is written only to the ephemeral runner's global git
        #     config (~/.gitconfig), which is discarded when the job ends.
        #   - This rewrite is CI-ONLY. Local development is unaffected and keeps
        #     using the SSH URL as-is (no ~/.gitconfig on your machine is touched
        #     by CI).
        #   - Required token scope: read access to the contents of
        #     aws-crypto-tools-commons (fine-grained PAT with `Contents: Read` on
        #     that repo, or a classic PAT with the `repo` scope).
        env:
          COMMONS_REPO_PAT: ${{ secrets.COMMONS_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${COMMONS_REPO_PAT:-}" ]; then
            echo "ERROR: the COMMONS_REPO_PAT secret is empty or unset." >&2
            echo "The private aws-crypto-tools-commons clone in the next step WILL FAIL" >&2
            echo "without it. Add a repository/org secret named COMMONS_REPO_PAT with" >&2
            echo "read access to the contents of aws-crypto-tools-commons (fine-grained" >&2
            echo "PAT with 'Contents: Read', or a classic PAT with the 'repo' scope)." >&2
            exit 1
          fi
          # Rewrite the SSH URL used in commons-source.json to authenticated
          # HTTPS so `git clone git@github.com:aws/aws-crypto-tools-commons.git`
          # transparently becomes an authenticated HTTPS clone.
          git config --global \
            url."https://x-access-token:${COMMONS_REPO_PAT}@github.com/".insteadOf \
            "git@github.com:"

      - name: Clone + set up commons at head (halts here on failure — Req 8.5)
        # A failure in THIS step (bad branch, network, missing esdk/test-server,
        # setup build failure) fails the job before any Tests run and names the
        # setup failure, satisfying Requirement 8.5.
        working-directory: esdk/test-server
        run: |
          make clone-commons-at-head \
            COMMONS_BRANCH="${COMMONS_BRANCH}" \
            HARNESS_JAVA_HOME="${JAVA_HOME_21_X64}"

      - name: Build the PR working tree as the LIVE ESDK Java artifact (Req 11.2)
        working-directory: esdk/test-server
        run: |
          make build-live-esdk \
            ESDK_JAVA_HOME="${JAVA_HOME_17_X64}" \
            ESDK_LIVE_VERSION="${ESDK_LIVE_VERSION}"

      - name: Orchestrate live round trip (live=Java working tree, Others @head)
        working-directory: esdk/test-server
        run: |
          make orchestrate-live \
            HARNESS_JAVA_HOME="${JAVA_HOME_21_X64}" \
            ESDK_LIVE_VERSION="${ESDK_LIVE_VERSION}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esdk-test-server-reports
          path: |
            esdk/test-server/.commons-clone/esdk/test-server/servers/java/build/reports/tests
            esdk/test-server/.commons-clone/esdk/test-server/servers/java/build/test-results
            esdk/test-server/.commons-clone/esdk/test-server/tests/build/reports/tests
            esdk/test-server/.commons-clone/esdk/test-server/tests/build/test-results
            esdk/test-server/.commons-clone/esdk/test-server/orchestrator/build/reports/tests
            esdk/test-server/.commons-clone/esdk/test-server/orchestrator/build/test-results
          if-no-files-found: ignore
