name: mpl-native-java

on:
  pull_request:
    paths: ["mpl/**", "spec", ".gitmodules", ".github/workflows/mpl-native-java.yml"]
  push:
    paths: ["mpl/**", "spec", ".gitmodules", ".github/workflows/mpl-native-java.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: |
            8
            17
      # Gradle runs on 17; the build's toolchain compiles and tests on 8.
      - name: Build and test
        working-directory: mpl
        run: ./gradlew build
      - name: Check the copied model classes against their source
        run: |
          ref=$(grep -o '`[0-9a-f]\{9\}`' mpl/MODEL_PROVENANCE.md | head -1 | tr -d '`')
          git clone --filter=blob:none https://github.com/aws/aws-cryptographic-material-providers-library.git /tmp/mpl
          mpl/scripts/sync-model.sh /tmp/mpl "$ref" --check

  duvet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # duvet publishes no prebuilt binary; the runner has cargo preinstalled.
      - name: Install duvet
        run: cargo +stable install duvet
      - name: Duvet report
        run: mpl/scripts/duvet.sh
      - name: Upload duvet report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpl-duvet-report
          include-hidden-files: true
          path: mpl/.duvet/reports/report.html
