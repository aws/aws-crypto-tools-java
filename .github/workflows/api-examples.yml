name: API examples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      libraries: ${{ steps.list.outputs.libraries }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: |
            8
            17
      - name: Test the discovery code
        run: ./gradlew -p build-logic test
      - name: Write surface.json for every library
        run: ./gradlew apiSurface
      # One directory per library, so the artifact keeps the library names.
      - name: List the libraries
        id: list
        run: |
          for surface in */build/api-examples/surface.json; do
            install -D "$surface" "api-surfaces/${surface%%/*}/surface.json"
          done
          echo "libraries=$(ls api-surfaces | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: api-surfaces
          path: api-surfaces

  api-examples:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        library: ${{ fromJSON(needs.discover.outputs.libraries) }}
    uses: aws/aws-crypto-tools-commons/.github/workflows/api-examples.yml@lucmcdon/api-examples
    with:
      library: ${{ matrix.library }}
      language: java
      surface-artifact: api-surfaces
      surface-path: ${{ matrix.library }}/surface.json
      src: ${{ matrix.library }}/src/test
      commons-ref: lucmcdon/api-examples
